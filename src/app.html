<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    %sveltekit.head%
  </head>
  <body
    style="margin: 0px; box-sizing: border-box; background-color: #000000; font-weight: bold; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;"
    data-sveltekit-preload-data="hover"
  >
    <div class="scaleContainer" style="display: contents">%sveltekit.body%</div>
  </body>
  <style>
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: fixed;
      overscroll-behavior: none;
      touch-action: none;
    }
  </style>
</html>
